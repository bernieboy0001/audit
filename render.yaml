services:
  - type: web
    name: audit-agent
    # Free tier (512 MB / 0.1 CPU / $0). No persistent disk needed: the
    # on-chain AuditRegistry is the durable ledger; local state is rebuilt
    # from the chain if the instance restarts.
    runtime: docker
    plan: free
    dockerfilePath: packages/agent/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /app/.data
      - key: CYCLE_MS
        value: "15000"
      - key: CONVICTION
        value: "high"
      - key: RPC_URL
        sync: false
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: MARKET_MAKER_PRIVATE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
